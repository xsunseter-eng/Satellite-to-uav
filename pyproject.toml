[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sat2uav"
version = "0.1.0"
description = "Synthetic UAV flight video generator from public satellite & high-resolution multispectral/LiDAR geospatial data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "moderngl>=5.10",
]

[project.scripts]
sat2uav = "sat2uav.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
