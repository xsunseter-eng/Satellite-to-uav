# Aviation-Grounded Default Configuration for Satellite-to-UAV Generation (v1.1)
# Standard Aviation English justification documented in update_logs/2026-11-23_log_004_aviation_parameters_and_engines.md

num_videos: 100
duration_sec: 10.0
fps: 30
keyframe_interval: 10
keyframe_format: png
render_engine: gpu_opengl_raymarch   # Options: gpu_opengl_raymarch | gpu_opengl_mesh | cpu_raymarch
seed: 42

flight:
  # X = region's maximum geofence radius (110-300 km); set null to automatically use full region geofence
  max_start_offset_km: null
  # Yaw heading (degrees true, 0 = North, clockwise)
  yaw_deg_range: [0.0, 360.0]
  # Aviation statistical airspeed: Truncated Log-Normal [100 km/h, Mach 1.8 (2205 km/h ISA MSL)]
  # Mean = 204.0 km/h (110.2 KTAS); Median = 170.0 km/h (Bayraktar TB2 operational reference)
  use_aviation_distributions: true
  speed_mps_range: [27.78, 612.53]      # 100 km/h to Mach 1.8 (ISA MSL)
  # Aviation statistical altitude AGL: Truncated Log-Normal [120 m (400 ft sUAS), 15,240 m (FL500 F-22/HALE)]
  # Median = 1,631 m (~5,350 ft); Mean = 2,400 m; P90 = 5,316 m (~18,000 ft TB2 ops)
  altitude_agl_m_range: [120.0, 15240.0]
  boundary_margin_m: 120.0

camera:
  # #20 (Revised): 4 standard aviation/UAV 16:9 resolutions (NO 4K), equally distributed (25% each)
  equal_resolution_distribution: true
  resolutions:
    - [640, 360]     # 360p — Low-bandwidth tactical / LWIR downlink
    - [854, 480]     # 480p — SD EO/IR downlink
    - [1280, 720]    # 720p — HD tactical ISR feed
    - [1920, 1080]   # 1080p — Full HD stabilized EO/IR gimbal
  # Horizontal FoV: Truncated Normal mu=58 deg, sigma=16 deg, bounds [24, 90] deg
  # Spans WESCAM MX-15 / ASELSAN CATS wide-mode (24-45 deg) through tactical sUAS wide optics (65-90 deg)
  fov_deg_range: [24.0, 90.0]
  # Camera depression/pitch: Truncated Normal mu=-55 deg, sigma=16 deg, bounds [-90, -20] deg
  pitch_deg_range: [-90.0, -20.0]
  spectral_modes:
    - rgb
    - panchromatic
    - nir
    - false_color_cir
    - thermal_lwir
    - night_vision
  # #7: Optical radial & tangential lens distortion
  lens_distortion:
    enabled: true
    k1_range: [-0.22, 0.12]
    k2_range: [-0.05, 0.05]
    p1_range: [-0.01, 0.01]
    p2_range: [-0.01, 0.01]

lighting:
  # Solar azimuth uniform [0, 360); Solar elevation Truncated Normal mu=42 deg, sigma=18 deg, bounds [8, 78] deg
  sun_azimuth_deg_range: [0.0, 360.0]
  sun_elevation_deg_range: [8.0, 78.0]
  night_probability: 0.20
  shadow_strength_range: [0.25, 0.70]
  # #16: Color temperature (Kelvin) & white balance tint
  color_temp_k_range: [3600.0, 8200.0]
  wb_tint_range: [-0.07, 0.07]

atmosphere:
  # #12: Mathematical regional climatology + ABL altitude + stochastic weather visibility model
  haze_enabled: true
  use_mathematical_visibility_model: true
  visibility_km_range: [2.0, 40.0]
  # #15: Sun glare, lens flare & surface specular glint
  sun_glare_enabled: true
  glare_intensity_range: [0.15, 0.70]
  specular_glint_range: [0.10, 0.50]

sensor_and_artifacts:
  # #6: Velocity-coupled motion blur & CMOS rolling-shutter skew
  motion_blur_enabled: true
  shutter_sec_range: [0.002, 0.018]
  rolling_shutter_strength_range: [0.0, 0.60]
  # #8: Auto-exposure temporal lag & dynamic range clipping
  auto_exposure_enabled: true
  ae_target_luma_range: [0.44, 0.58]
  ae_lag_alpha_range: [0.10, 0.35]
  dr_clip_strength_range: [0.0, 0.30]
  # #9: Sensor noise (optical ISO/shot noise, thermal FPN/striping)
  sensor_noise_enabled: true
  iso_noise_range: [0.005, 0.040]
  thermal_fpn_range: [0.008, 0.035]
  # Baseline footage defects: lens cracks & water marks / droplets
  lens_crack_probability: 0.20
  watermark_droplet_probability: 0.25
